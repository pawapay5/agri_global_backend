# Commodities tracked in Ghana: local names, local units → kg, crop calendars.
# kg factors are typical values. Refine them per market from enumerator data.
# `major_regions` are the main producing regions. `aliases` maps upstream source names (e.g. WFP).
tracked:
  - code: maize_white
    local_names: { tw: aburo, ee: bli, dag: kawana }
    major_regions: [BE, BO, AH, NP, EP]
    aliases: ["Maize", "Maize (white)"]
    units: { olonka: 2.5, bag: 100 }
    calendars:
      - { planting: [3, 4, 8, 9], harvest: [7, 8, 11, 12], lean: [5, 6] }                 # south/middle belt: bimodal
      - { regions: [NP, NE, SV, UE, UW], planting: [5, 6, 7], harvest: [9, 10, 11], lean: [5, 6, 7] }  # north: unimodal
  - code: maize_yellow
    major_regions: [BE, BO, AH, NP, EP]
    aliases: ["Maize (yellow)"]
    units: { olonka: 2.5, bag: 100 }
    calendars:
