# Generic checklists per destination. `commodity`/`category` narrow a requirement; omit both for all produce.
export_requirements:
  - destination: EU
    code: eu_phytosanitary_certificate
    mandatory: true
    authority: National Plant Protection Organisation (exporting country)
    url: https://food.ec.europa.eu/plants/plant-health-and-biosecurity_en
    title: { en: EU phytosanitary certificate, fr: Certificat phytosanitaire UE }
    description: { en: "Required for regulated fresh fruit and vegetables under Regulation (EU) 2016/2031. Issued after inspection by the exporting country's plant protection organisation." }
  - destination: EU
    code: mrl_compliance
    mandatory: true
    authority: European Commission, Regulation (EC) No 396/2005
    url: https://food.ec.europa.eu/plants/pesticides/maximum-residue-levels_en
    title: { en: Pesticide residue (MRL) compliance, fr: Conformité aux LMR }
    description: { en: "Residues must not exceed EU maximum residue levels. Keep spray records and lab results for each lot." }
  - destination: EU
    code: traceability
    mandatory: true
    authority: Regulation (EC) No 178/2002
    title: { en: Lot traceability records, fr: Traçabilité des lots }
    description: { en: "Record one step back and one step forward for every lot: farm, harvest date and buyer." }
  - destination: EU
    code: globalgap
    mandatory: false
    authority: GLOBALG.A.P.
    url: https://www.globalgap.org/
    title: { en: GlobalG.A.P. certification, fr: Certification GlobalG.A.P. }
    description: { en: "Not legally required, but most EU retailers expect it for fresh produce." }
  - destination: EU
    code: eudr_due_diligence
    category: cash_crops
    mandatory: true
    authority: Regulation (EU) 2023/1115 (EUDR)
    url: https://environment.ec.europa.eu/topics/forests/deforestation/regulation-deforestation-free-products_en
    title: { en: Deforestation-free due diligence (EUDR), fr: Diligence raisonnée RDUE }
    description: { en: "Cocoa and other covered commodities need plot geolocation and proof of deforestation-free production." }
  - destination: GB
    code: uk_phytosanitary_certificate
    mandatory: true
    authority: DEFRA / APHA
    url: https://www.gov.uk/guidance/import-plants-and-plant-products-from-non-eu-countries-to-great-britain
    title: { en: UK phytosanitary certificate }
    description: { en: "Required for regulated fresh produce entering Great Britain. Pre-notify through IPAFFS." }
  - destination: GB
    code: mrl_compliance
    mandatory: true
    authority: HSE (GB MRL Statutory Register)
    title: { en: Pesticide residue (MRL) compliance }
    description: { en: "Residues must meet GB maximum residue levels." }

# Plans: codes and entitlements. Prices and provider plan ids are business settings, so set them
# through PATCH /v1/admin/tables/plans/{code}, e.g.
#   prices:       {"GHS": {"monthly": "...", "yearly": "..."}}
#   provider_ids: {"paystack": {"monthly_GHS": "PLN_..."}, "stripe": {"monthly_USD": "price_..."}}
# Entitlements left empty here use the defaults in apps/api/src/modules/billing/entitlements.logic.ts.
plans:
  - { code: free, sort_order: 0, name: { en: Free, fr: Gratuit } }
  - { code: premium, sort_order: 1, name: { en: Premium, fr: Premium } }
  - { code: organisation, sort_order: 2, name: { en: Organisation, fr: Organisation } }
