[project]
name = "agriprice-ml"
version = "1.0.0"
description = "AgriPrice price forecasting: LightGBM/XGBoost quantile models, walk-forward backtests, SHAP explanations"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "shap>=0.46",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "mlflow-skinny>=2.16",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agriprice_ml*"]
