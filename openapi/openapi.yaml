        disputeReason: { type: string, enum: [not_received, not_as_described, damaged, wrong_quantity, other] }
        expectedVersion: { type: integer, description: Optimistic-concurrency guard }
    ReviewCreate:
      type: object
      required: [rating]
      properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string, maxLength: 2000 } }
    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        reason: { type: string }
        description: { type: string }
        status: { type: string }
        resolution: { type: [object, "null"], additionalProperties: true }
        evidence: { type: array, items: { type: object, properties: { id: { type: string }, uploadedBy: { type: string }, note: { type: [string, "null"] }, url: { type: [string, "null"] }, createdAt: { type: string } } } }
        createdAt: { type: string, format: date-time }

    # ── payments ──
    PayRequest:
      type: object
      required: [provider]
