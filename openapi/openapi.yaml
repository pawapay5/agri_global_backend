        bankCode: { type: string, maxLength: 20 }
        accountNumber: { type: string, maxLength: 30 }
        accountName: { type: string, maxLength: 120 }
        isDefault: { type: boolean }
    PayoutAccount:
      type: object
      properties: { id: { type: string, format: uuid }, type: { type: string }, provider: { type: string }, label: { type: string }, network: { type: [string, "null"] }, isDefault: { type: boolean } }
    PayoutRequest:
      type: object
      required: [amount]
      properties: { amount: { $ref: "#/components/schemas/Decimal" }, accountId: { type: string, format: uuid } }
    Payout:
      type: object
      properties: { id: { type: string, format: uuid }, amount: { type: string }, currency: { type: string }, status: { type: string }, accountId: { type: string, format: uuid }, failureReason: { type: [string, "null"] }, createdAt: { type: string, format: date-time } }

    # ── community ──
