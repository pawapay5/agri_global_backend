    TrainingItem:
      type: object
      properties: { id: { type: string, format: uuid }, kind: { type: string }, title: { type: string }, body: { type: string }, startsAt: { type: [string, "null"], format: date-time }, endsAt: { type: [string, "null"], format: date-time }, venue: { type: [string, "null"] }, regionId: { type: [string, "null"] }, url: { type: [string, "null"] } }
    InputSupplier:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, categories: { type: array, items: { type: string } }, description: { type: string }, regionId: { type: [string, "null"] }, location: { oneOf: [{ $ref: "#/components/schemas/GeoPoint" }, { type: "null" }] }, distanceKm: { type: ["null", number] }, phone: { type: [string, "null"] }, whatsapp: { type: [string, "null"] }, website: { type: [string, "null"] }, verified: { type: boolean }, sellerId: { type: [string, "null"] } }

