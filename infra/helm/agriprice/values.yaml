image:
  registry: ghcr.io/agriprice
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Secret synced from AWS Secrets Manager by External Secrets Operator (see templates/externalsecret.yaml)
secretStore: aws-secrets-manager
secretKey: agriprice-prod/app

env:
  NODE_ENV: production
  API_PUBLIC_URL: https://api.agriprice.app
  CORS_ORIGINS: https://agriprice.app,https://gh.agriprice.app
  SEARCH_PROVIDER: postgres
  EMAIL_PROVIDER: ses
  SMS_PROVIDER: africastalking
  OPEN_METEO_URL: https://api.open-meteo.com/v1/forecast
  GOTENBERG_URL: http://agriprice-gotenberg:3000
  CLAMAV_HOST: agriprice-clamav
  CLAMAV_PORT: "3310"
  WEB_URL: https://agriprice.app

api:
  replicas: 3
  resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
  hpa: { min: 3, max: 20, cpu: 70 }
  ingress:
    host: api.agriprice.app
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'

workers:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }

ml:
  replicas: 1
  resources: { requests: { cpu: "2", memory: 4Gi }, limits: { memory: 8Gi } }
  nodeSelector: { workload: ml }
  tolerations: [{ key: workload, value: ml, effect: NoSchedule }]
