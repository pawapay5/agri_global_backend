
x-backend-env: &backend-env
  NODE_ENV: production
  API_PORT: "3001"
  API_PUBLIC_URL: ${SERVICE_URL_API}
  WEB_URL: ${SERVICE_URL_WEB}
  CORS_ORIGINS: ${SERVICE_URL_WEB}
  DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/agriprice
  REDIS_URL: redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379/0
  JWT_ACCESS_SECRET: ${SERVICE_PASSWORD_64_JWT}
  JWT_ISSUER: agriprice
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Generate with `openssl rand -base64 32` and keep it safe; losing it makes encrypted fields unreadable}
  OTP_PEPPER: ${SERVICE_PASSWORD_64_OTP}
  WEBHOOK_SHARED_SECRET: ${SERVICE_PASSWORD_64_WEBHOOK}
  ML_SERVICE_URL: http://ml:8001
  ML_SERVICE_TOKEN: ${SERVICE_PASSWORD_64_ML}
  REVALIDATE_SECRET: ${SERVICE_PASSWORD_64_REVALIDATE}
  WEB_REVALIDATE_URL: http://web:3000/api/revalidate
  S3_ENDPOINT: ${SERVICE_URL_STORAGE}
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${SERVICE_USER_STORAGE}
  S3_SECRET_KEY: ${SERVICE_PASSWORD_STORAGE}
  S3_BUCKET_REPORTS: agriprice-reports
  S3_BUCKET_IMAGES: agriprice-images
  GOTENBERG_URL: http://gotenberg:3000
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  SEARCH_PROVIDER: postgres
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_URL: ${SMTP_URL:?SMTP connection string for transactional email, e.g. smtps://user:pass@smtp.example.com:465}
  EMAIL_FROM: ${EMAIL_FROM:?Sender, e.g. "AgriPrice <no-reply@your-domain>"}
  SMS_PROVIDER: ${SMS_PROVIDER:-log}
  AT_USERNAME: ${AT_USERNAME:-}
  AT_API_KEY: ${AT_API_KEY:-}
  AT_SENDER_ID: ${AT_SENDER_ID:-}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
  RUN_SCHEDULERS: "true"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-${COOLIFY_BRANCH:-prod}}
  # Values the code defaults with `??`: give real defaults here, because an empty string would override them.
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
  OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
  # Optional integrations: empty means "not configured" and the feature stays off.
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
  AWS_SES_REGION: ${AWS_SES_REGION:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
  FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
  HUBTEL_CLIENT_ID: ${HUBTEL_CLIENT_ID:-}
  HUBTEL_CLIENT_SECRET: ${HUBTEL_CLIENT_SECRET:-}
  HUBTEL_POS_ID: ${HUBTEL_POS_ID:-}
  HUBTEL_PREPAID_ID: ${HUBTEL_PREPAID_ID:-}
  REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
  KYC_PROVIDER_URL: ${KYC_PROVIDER_URL:-}
  KYC_PROVIDER_KEY: ${KYC_PROVIDER_KEY:-}
  HELPDESK_WEBHOOK_URL: ${HELPDESK_WEBHOOK_URL:-}
  HELPDESK_WEBHOOK_SECRET: ${HELPDESK_WEBHOOK_SECRET:-}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${SERVICE_URL_WEB}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_APPLE_SERVICE_ID: ${NEXT_PUBLIC_APPLE_SERVICE_ID:-}
        IMAGES_HOST: ${SERVICE_FQDN_STORAGE}
    environment:
      - SERVICE_FQDN_WEB_3000
      - AGRIPRICE_API_URL=http://api:3001
      - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_WEB}
      - REVALIDATE_SECRET=${SERVICE_PASSWORD_64_REVALIDATE}
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379/1
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
      - CSP_CONNECT_SRC=${CSP_CONNECT_SRC:-}
      - SSR_FETCH_TIMEOUT_MS=${SSR_FETCH_TIMEOUT_MS:-5000}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-10000}
      - API_LONG_TIMEOUT_MS=${API_LONG_TIMEOUT_MS:-60000}
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *backend-env
      SERVICE_FQDN_API_3001: ""
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # One-shot: applies pending migrations before the API starts. Seeding a country is a manual step (see docs).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/agriprice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    exclude_from_hc: true

  workers:
    build: { context: ., dockerfile: apps/workers/Dockerfile }
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    exclude_from_hc: true

  ml:
    build: { context: apps/ml, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/agriprice
      API_INTERNAL_URL: http://api:3001
      ML_SERVICE_TOKEN: ${SERVICE_PASSWORD_64_ML}
      JWT_ACCESS_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_ISSUER: agriprice
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_DIR: /models
    volumes: [models:/models]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    # TimescaleDB + PostGIS for PG16
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: agriprice
    volumes: [pgdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agriprice"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SERVICE_PASSWORD_REDIS}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    restart: unless-stopped

  # S3-compatible object storage (uploads, report files). RustFS replaces MinIO, whose images are no longer
  # published on Docker Hub. Runs as UID 10001; storage-perms fixes volume ownership first.
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      - SERVICE_FQDN_STORAGE_9000
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_STORAGE}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_STORAGE}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=false
    volumes: [storagedata:/data]
    depends_on:
      storage-perms: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || wget -qO- http://127.0.0.1:9000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # One-shot: the storage container runs as UID 10001, so the named volume must belong to it.
  storage-perms:
    image: alpine:3.20
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes: [storagedata:/data]
    restart: "no"
    exclude_from_hc: true

  # One-shot: creates the buckets and makes agriprice-images publicly readable (catalogue images are plain links).
  storage-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      storage: { condition: service_started }
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_STORAGE}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_STORAGE}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        S3="aws --endpoint-url http://storage:9000"
        for i in $$(seq 1 60); do $$S3 s3api list-buckets >/dev/null 2>&1 && break; echo "waiting for storage ($$i)"; sleep 3; done
        for b in agriprice-reports agriprice-images; do
          $$S3 s3api head-bucket --bucket $$b 2>/dev/null || $$S3 s3api create-bucket --bucket $$b || exit 1
        done
        if $$S3 s3api put-bucket-policy --bucket agriprice-images --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::agriprice-images/*"]}]}'; then
          echo "agriprice-images is publicly readable"
        else
          echo "WARNING: could not set a public-read policy on agriprice-images; catalogue images will return 403 until it is set" >&2
        fi
    restart: "no"
    exclude_from_hc: true

  gotenberg:
    image: gotenberg/gotenberg:8.20
    restart: unless-stopped

  # Virus scanning for uploads. Needs ~1.5 GB RAM; first start downloads signatures (1–2 min).
  clamav:
    image: clamav/clamav:1.4
    volumes: [clamdata:/var/lib/clamav]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes: [mlflowdata:/mlflow]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  storagedata: {}
  mlflowdata: {}
  clamdata: {}
  models: {}
