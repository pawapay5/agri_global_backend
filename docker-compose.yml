name: agriprice

services:
  postgres:
    # timescaledb-ha ships TimescaleDB + PostGIS (+ toolkit) for PG16
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: agriprice
      POSTGRES_PASSWORD: agriprice
      POSTGRES_DB: agriprice
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriprice"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # S3-compatible storage (RustFS; MinIO images are no longer published on Docker Hub). Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: agriprice
      RUSTFS_SECRET_KEY: agriprice-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [storagedata:/data]
    depends_on:
      storage-perms: { condition: service_completed_successfully }

  storage-perms:
    image: alpine:3.20
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes: [storagedata:/data]

  storage-init:
    image: amazon/aws-cli:2.27.0
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: agriprice
      AWS_SECRET_ACCESS_KEY: agriprice-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        S3="aws --endpoint-url http://storage:9000"
        for i in $$(seq 1 60); do $$S3 s3api list-buckets >/dev/null 2>&1 && break; sleep 2; done
        for b in agriprice-reports agriprice-images agriprice-mlflow; do $$S3 s3api head-bucket --bucket $$b 2>/dev/null || $$S3 s3api create-bucket --bucket $$b; done
        $$S3 s3api put-bucket-policy --bucket agriprice-images --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::agriprice-images/*"]}]}' || echo "WARNING: public-read policy not set on agriprice-images"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]

  # HTML → PDF for reports
  gotenberg:
    image: gotenberg/gotenberg:8.20
    ports: ["3002:3000"]

  # Virus scanning for uploads (clamd INSTREAM on 3310). The first start downloads signatures (~1-2 min).
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    volumes: [clamdata:/var/lib/clamav]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

volumes:
  pgdata: {}
  redisdata: {}
  storagedata: {}
  meilidata: {}
  mlflowdata: {}
  clamdata: {}
