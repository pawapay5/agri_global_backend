name: agriprice

services:
  postgres:
    # timescaledb-ha ships TimescaleDB + PostGIS (+ toolkit) for PG16
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: agriprice
      POSTGRES_PASSWORD: agriprice
      POSTGRES_DB: agriprice
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriprice"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agriprice
      MINIO_ROOT_PASSWORD: agriprice-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 &&
      mc alias set local http://minio:9000 agriprice agriprice-secret &&
      mc mb -p local/agriprice-reports local/agriprice-images local/agriprice-mlflow"

  meilisearch:
    image: getmeili/meilisearch:v1.14
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  meilidata: {}
  mlflowdata: {}
