name: agriprice-pipelines
prefect-version: 3.0.0

deployments:
  - name: fx-daily
    entrypoint: flows/fx.py:fx_daily
    schedules: [{ cron: "0 6 * * *", timezone: UTC }]
    work_pool: { name: agriprice }

  - name: wfp-prices-gh
    entrypoint: flows/wfp_prices.py:wfp_prices
    parameters: { country: GH, source_code: wfp_hdx_gh }
    schedules: [{ cron: "0 4 * * 1", timezone: UTC }]
    work_pool: { name: agriprice }

  - name: weather-monthly-gh
    entrypoint: flows/weather.py:weather_monthly
    parameters: { country: GH }
    schedules: [{ cron: "0 2 1 * *", timezone: UTC }]
    work_pool: { name: agriprice }

  - name: nightly-gh
    entrypoint: flows/nightly.py:nightly
    parameters: { country: GH, promote: auto }
    schedules: [{ cron: "30 1 * * *", timezone: Africa/Accra }]
    work_pool: { name: agriprice }
