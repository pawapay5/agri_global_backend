[project]
name = "agriprice-pipelines"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "prefect>=3.0,<4",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "agriprice-ml",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
agriprice-ml = { path = "../apps/ml", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
